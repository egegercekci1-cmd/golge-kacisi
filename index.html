<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Gölge Kaçışı</title>

<style>
body{margin:0;background:#000;overflow:hidden;font-family:Arial}
canvas{display:block;margin:auto}
.btn{
  position:fixed;bottom:10px;width:60px;height:60px;
  border-radius:50%;background:#00ffff88;
  text-align:center;line-height:60px;font-size:24px;
}
#left{left:20px}
#right{left:100px}
#jump{right:20px}
.overlay{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  background:#000c;color:#fff;
}
.overlay button{
  padding:12px 30px;font-size:20px;
  border:0;border-radius:10px;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="left" class="btn">⬅️</div>
<div id="right" class="btn">➡️</div>
<div id="jump" class="btn">⬆️</div>

<div id="menu" class="overlay">
  <h1>GÖLGE KAÇIŞI</h1>
  <button onclick="start()">BAŞLA</button>
</div>

<div id="dead" class="overlay" style="display:none">
  <h1>💀 ÖLDÜN</h1>
  <p>Level: <span id="fLevel"></span></p>
  <button onclick="start()">TEKRAR</button>
</div>

<script>
/* CANVAS */
const c=document.getElementById("c"),x=c.getContext("2d");
const W=640,H=360,dpr=window.devicePixelRatio||1;
c.width=W*dpr;c.height=H*dpr;
c.style.width=W+"px";c.style.height=H+"px";
x.scale(dpr,dpr);

/* SABİTLER */
const groundY=300,grav=0.6,levelLength=1500;

/* DURUM */
let state="menu",cam=0,level=1,lives=3;
let L=false,R=false;

/* NESNELER */
let p,shadow,npc,bear,spikes=[];

/* KONTROLLER */
left.ontouchstart=()=>L=true;
left.ontouchend=()=>L=false;
right.ontouchstart=()=>R=true;
right.ontouchend=()=>R=false;
jump.ontouchstart=()=>{if(p.y>=groundY-p.h)p.vy=-12};

/* ÇARPIŞMA */
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

/* BAŞLAT */
function start(){
  menu.style.display="none";
  dead.style.display="none";
  state="play";
  level=1;
  lives=3;
  reset();
}

/* RESET */
function reset(){
  p={x:50,y:240,w:40,h:60,vy:0};

  shadow={x:-200,y:240,w:40,h:60,s:1+level*0.2};

  npc={x:500,y:240,w:40,h:60,dir:1,min:400,max:700};

  bear={
    x:900,y:240,w:60,h:60,
    speed:0.9+level*0.15,
    state:"patrol",
    min:800,max:1200,
    slow:0
  };

  spikes=[];
  for(let i=1;i<=level+2;i++){
    spikes.push({x:300+i*250,y:260,w:30,h:40});
  }

  cam=0;
}

/* ÖLÜM */
function die(){
  state="dead";
  fLevel.textContent=level;
  dead.style.display="flex";
}

/* LEVEL */
function nextLevel(){
  level++;
  reset();
}

/* UPDATE */
function update(){
  if(L)p.x-=3;
  if(R)p.x+=3;

  p.vy+=grav;p.y+=p.vy;
  if(p.y>240){p.y=240;p.vy=0}

  /* GÖLGE */
  shadow.x+=Math.sign(p.x-shadow.x)*shadow.s;

  /* NPC */
  npc.x+=npc.dir*1.2;
  if(npc.x<npc.min||npc.x>npc.max)npc.dir*=-1;

  /* 🐻 AYI AI */
  const dist=Math.abs(p.x-bear.x);

  if(bear.slow>0)bear.slow--;

  bear.state = dist<250 ? "chase" : "patrol";

  if(bear.state==="chase"){
    bear.x+=Math.sign(p.x-bear.x)*(bear.speed-(bear.slow>0?0.4:0));
  }else{
    bear.x+=bear.speed*0.5;
    if(bear.x>bear.max)bear.x=bear.min;
  }

  /* ÜZERİNDEN ZIPLAMA */
  if(hit(p,bear)&&p.vy>0){
    bear.slow=40;
    p.vy=-10;
  }

  /* ÇARPIŞMA */
  if(
    hit(p,shadow)||hit(p,npc)||
    spikes.some(s=>hit(p,s))
  ){
    lives--;
    p.x=50;
    if(lives<=0)die();
  }

  if(p.x>level*levelLength)nextLevel();

  cam=Math.max(0,p.x-320);
}

/* ÇİZ */
function draw(){
  x.clearRect(0,0,W,H);
  x.save();x.translate(-cam,0);

  /* ARKA PLAN */
  let g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0a1a2a");
  g.addColorStop(1,"#1e3c5a");
  x.fillStyle=g;x.fillRect(0,0,3000,H);

  /* ZEMİN */
  x.fillStyle="#444";
  x.fillRect(0,groundY,3000,40);

  /* DİKEN */
  x.fillStyle="#f00";
  spikes.forEach(s=>x.fillRect(s.x,s.y,s.w,s.h));

  /* OYUNCU */
  x.fillStyle="#0ff";
  x.fillRect(p.x,p.y,p.w,p.h);

  /* GÖLGE */
  x.fillStyle="#000";
  x.fillRect(shadow.x,shadow.y,shadow.w,shadow.h);

  /* NPC */
  x.fillStyle="#ff0";
  x.fillRect(npc.x,npc.y,npc.w,npc.h);

  /* 🐻 AYI TEXTURE */
  x.fillStyle="#7a3f1d";
  x.fillRect(bear.x,bear.y,bear.w,bear.h);

  x.fillStyle="#a86b3c";
  x.fillRect(bear.x+10,bear.y+20,bear.w-20,bear.h-25);

  x.fillStyle="#000";
  x.fillRect(bear.x+15,bear.y+15,5,5);
  x.fillRect(bear.x+bear.w-20,bear.y+15,5,5);
  x.fillRect(bear.x+bear.w/2-5,bear.y+30,10,4);

  x.restore();

  x.fillStyle="#fff";
  x.fillText("❤️ "+lives+"  LEVEL "+level,10,20);
}

/* LOOP */
(function loop(){
  if(state==="play"){update();draw()}
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
